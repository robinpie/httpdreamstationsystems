<!DOCTYPE html>
<!--
  Static backstop for /professional/status.

  nginx serves this via `error_page 502 504` when status.cgi cannot run at all
  (fcgiwrap down, script missing, syntax error that survived the deploy gate).
  It is deliberately static and dependency-free: it has to work precisely when
  the dynamic path does not.

  Note what it does NOT say: it does not claim the services are down. It only
  claims the status page is down, because that is the only thing it knows.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service status — unavailable</title>
  <meta name="robots" content="noindex">
  <style>html{color-scheme:light dark}body{padding:1rem;font:100%/1.5 system-ui,sans-serif;max-width:40rem;margin-inline:auto}.warn{border:2px solid;border-radius:.5rem;padding:.75rem 1rem}a{overflow-wrap:anywhere}:focus-visible{outline:2px solid;outline-offset:2px}</style>
</head>

<body>

<h1>Service status is unavailable</h1>

<p class="warn">Ironically, the status page is currently broken. Other services may or may not still be up.</p>

<p>Maybe check out my <a href="https://www.ntppool.org/scores/67.215.249.229">NTP pool monitoring page</a>, which is measured independently.</p>

<p><a href="/professional/">← Robin Reel</a></p>

</body>
</html>
