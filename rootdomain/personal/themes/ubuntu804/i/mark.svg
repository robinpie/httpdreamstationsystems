<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- dreamstation.systems logotype mark.
     Original artwork. It is a beacon: a source and three widening pulses,
     which is what this machine mostly does for a living (it is in the NTP
     pool). Deliberately NOT the Circle of Friends — that mark and the Ubuntu
     wordmark are Canonical trademarks and neither is used anywhere on this
     site. The orange is #c0400f, a shade off Canonical's #dd4814, for the
     same reason.
     Geometry: a rounded square source at (10,54), arcs at r21/r35/r49, 8
     wide, running north to east. The source is a box, not a dot, so the mark
     reads as a machine transmitting rather than as a feed icon. Ink fills 1..63 in both axes so background-size:contain lands it
     exactly in its 62px slot. -->
<g fill="none" stroke="#c0400f" stroke-width="8" stroke-linecap="round">
  <path d="M10 33A21 21 0 0 1 31 54"/>
  <path d="M10 19A35 35 0 0 1 45 54" opacity=".68"/>
  <path d="M10 5A49 49 0 0 1 59 54" opacity=".42"/>
</g>
<rect x="1" y="45" width="18" height="18" rx="4.5" fill="#c0400f"/>
</svg>
