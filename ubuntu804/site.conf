# dreamstation.systems — Ubuntu 8.04 desktop web template.
#
# Read by build.pl. One "Key: value" per line; blank lines and #-comments are
# ignored. Every path-shaped value is here rather than in the templates so that
# moving this tree from /tmp-ubuntu804/ to the domain root is a change to THIS
# FILE ONLY — see ubuntu804template.txt, "Promoting out of the temp path".

# Absolute URL of the tree root, no trailing slash. Shown in the location bar
# (Base + a page's Url) and used for <link rel=canonical>.
Base: https://dreamstation.systems/tmp-ubuntu804

# Root-relative prefix, no trailing slash, that every generated href and asset
# URL is written with. Must be Base's path component.
Root: /tmp-ubuntu804

# Panel label. Replaces the reference screenshot's "Live session user".
SiteName: dreamstation.systems

# Where the panel's Firefox icon and the toolbar's Home button point
# (requirement 3). NOT the title-bar icon, which is decoration.
# During the temp phase this is the template's own home, so that Home keeps you
# inside the desktop instead of dropping you on the real site index. Set to "/"
# when the tree is promoted to the domain root.
Home: /tmp-ubuntu804/

# Height in px of the exposed wallpaper strip along the bottom — the badge
# shelf. The reference screenshot shows 85px; the user chose 48px for more
# window. Becomes the --strip-h custom property in site.css.
StripHeight: 48
