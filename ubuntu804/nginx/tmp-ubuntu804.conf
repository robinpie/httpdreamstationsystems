# Temporary: Ubuntu 8.04 desktop web template, served at /tmp-ubuntu804/.
#
# SSI is on for this tree because the panel clock on EVERY page is an
# <!--#echo var="date_gmt"--> — nginx renders it in-worker, with no CGI and no
# fork. That matters on a 1-vCPU box whose main job is the NTP pool.
#
# ssi_silent_errors: the clock is decoration. If it ever fails to expand it must
# leave the page intact, exactly as snippets/status-cgi.conf does for the vitals
# box.
#
# ^~ (not =) because this is a tree of pages, every one of which carries the
# clock, and because `index index.html` internally redirects /tmp-ubuntu804/ and
# /tmp-ubuntu804/about/ to their index.html — internal redirects re-run location
# matching, so the prefix has to cover the whole subtree, not one exact URI.
#
# Included from BOTH the :80 and :443 dreamstation.systems server blocks, same
# reasoning as status-cgi.conf: a page whose clock works over HTTP but renders a
# raw SSI comment over HTTPS would be a particularly silly bug.
#
# See ~/configNotes/http/ubuntu804template.txt for the design.
location ^~ /tmp-ubuntu804/ {
    ssi on;
    ssi_silent_errors on;

    # 404.html is a real page in this tree, with the desktop around it and the
    # address you actually asked for in its location bar — it echoes
    # REQUEST_URI, which #echo entity-escapes before the page sees it. No "="
    # before the URI, so the response keeps its 404 status for anything
    # machine-reading it.
    error_page 404 /tmp-ubuntu804/404.html;
}
