# OpenPGP Web Key Directory — draft-koch-openpgp-webkey-service.
#
# Included from BOTH the apex :443 block (direct method, keys under
# /.well-known/openpgpkey/hu/) and the openpgpkey.dreamstation.systems block
# (advanced method, keys under /.well-known/openpgpkey/dreamstation.systems/hu/).
# Same reasoning as status-cgi.conf: one file, so the two cannot drift apart.
#
# Content-Type is deliberately NOT set here. The key files are extensionless by
# design — the filename is a z-base-32 hash of the local part — so they inherit
# nginx.conf's `default_type application/octet-stream`, which is exactly what
# the spec requires for the binary key. Adding a types{} entry would be a way to
# get this wrong later.
#
# CORS is recommended by the spec so browser-based clients doing client-side
# encryption can fetch a key cross-origin. These are public keys published for
# the express purpose of being fetched by strangers; there is nothing to leak.
# `always` so the header survives error responses too.
location ~ ^/\.well-known/openpgpkey/ {
    include snippets/clacks.conf;
    add_header Access-Control-Allow-Origin "*" always;
}
