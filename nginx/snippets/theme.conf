# Server-side theme selection for /personal/.
#
# These pages used to pick their stylesheet in JavaScript: theme.js read
# localStorage and rewrote <link id="theme-css"> from <head>, synchronously,
# specifically so the swap happened before first paint. That works, but it
# costs a script on every page just to choose a CSS file, and it does nothing
# at all with JS off — which on a site whose whole character is Gopher, finger
# and Spartan is not a hypothetical visitor.
#
# Now nginx picks the theme and SSI stamps it into the page, so the correct
# stylesheet is in the first byte and there is no flash to avoid.
#
# HOW A THEME IS CHOSEN (the maps live at the top of
# sites-available/dreamstation.systems — map is only valid in http context,
# which is why the two halves of this feature are in different files):
#
#     ?theme=<id>   wins, if <id> is one of the known themes
#     Cookie theme= otherwise
#     gtk2          if neither is present or valid
#
# The switcher is a GET form, so choosing a theme is an ordinary form
# submission to ?theme=<id>. Nothing links with the parameter attached, and no
# <a href> anywhere had to be rewritten to carry it.
#
# WHY NOT REDIRECT AFTER SETTING THE COOKIE: an earlier design had the query
# parameter only set the cookie and then 302 back to the bare path. With
# cookies disabled that is a silent no-op — the redirect drops the parameter,
# the cookie never comes back, the page reloads looking identical and the
# switcher appears broken. Serving the requested theme on the same request
# means a cookieless visitor still gets the theme they asked for; they just
# lose it on the next navigation, which is exactly how the old localStorage
# version already degraded, and it is visible rather than silent. It also
# saves a round trip, and the ?theme= URL stays in the address bar so it can
# be bookmarked as a way to pin a theme without cookies at all.
#
# $theme is whitelisted BY THE MAPS, never taken raw from the request. An
# unknown value falls back to gtk2 rather than being interpolated into the
# stylesheet href, where it would 404 and leave the page unstyled. That is the
# real risk here, not injection: SSI's echo entity-encodes by default and
# nginx will not accept CR/LF in $arg_*.
#
# The file list is explicit rather than a wildcard. Only these seven pages
# carry the SSI directives; the other top-level HTML under /personal/
# (cover-letter.html and friends) keeps its own JavaScript and would gain
# nothing but the loss of Content-Length and sendfile. A new themed page has
# to be added here deliberately.
#
# /personal/ (no filename) reaches this block too: the server-level `index`
# turns it into an internal redirect to /personal/index.html, and location
# matching runs again on the rewritten URI. Without that it would serve the
# raw file with the SSI comments unprocessed and no stylesheet at all.
location ~ ^/personal/(index|blog|hypnospace|ntppost|ntpuserinfo|slowqotd|gzipt)\.html$ {
    ssi on;

    # Re-sent on every request, so a visitor who browses for a while keeps
    # renewing the year rather than expiring one year after their first visit.
    # $theme is already normalised to a known id by the maps, so this cannot
    # store anything the whitelist would later reject.
    add_header Set-Cookie "theme=$theme; Path=/personal/; Max-Age=31536000; SameSite=Lax" always;

    # The HTML body now differs by cookie. Without this a cache is entitled to
    # hand one visitor's theme to the next.
    add_header Vary "Cookie" always;

    # This block defines add_header of its own, which drops the server-level
    # X-Clacks-Overhead unless it is repeated here. See clacks.conf.
    include snippets/clacks.conf;
}
