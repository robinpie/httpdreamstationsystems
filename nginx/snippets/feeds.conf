# Content types for the blog feeds.
#
# Both files are generated by assets-build/make-feed.py from the post list in
# /personal/blog.html and rsynced into the docroot with everything else, so
# nothing here serves them — nginx already would. This snippet exists only to
# correct the type they go out with.
#
# WHY: mime.types maps .xml to text/xml, which is what /personal/feed.xml and
# /personal/rss.xml would otherwise be served as. That is not wrong enough to
# break a reader, but the registered types are application/atom+xml and
# application/rss+xml, and some feed autodiscovery treats text/xml as "some
# XML document, probably not a feed". The mapping in mime.types is by
# extension and both files must end in .xml, so the type is set per location
# instead. (mime.types does map .atom and .rss correctly — renaming the files
# would work too, but .xml is what every reader and validator expects to see
# at the end of a feed URL.)
#
# EXACT-MATCH locations, so these win outright: an `=` location beats the
# regex location in theme.conf, which would otherwise never match anyway
# because it lists .html filenames only. That is deliberate — a feed must not
# be SSI-parsed, must not get the theme cookie, and must not carry Vary:
# Cookie, none of which mean anything to a feed reader.
#
# NO add_header HERE, on purpose: a location that adds a header of its own
# drops the inherited X-Clacks-Overhead and would have to include
# clacks.conf again. These add none, so the header is inherited.
#
# INCLUDED FROM BOTH the :80 and :443 apex blocks, like clacks.conf and
# wkd.conf: a feed URL that worked over one scheme and not the other would be
# a subscription that breaks the first time a reader follows a redirect.
location = /personal/feed.xml {
    types { }
    default_type application/atom+xml;
}

location = /personal/rss.xml {
    types { }
    default_type application/rss+xml;
}
