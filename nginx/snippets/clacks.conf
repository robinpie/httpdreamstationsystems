# X-Clacks-Overhead — GNU Terry Pratchett.
#
# From Going Postal: a name sent up and down the clacks towers is never
# turned off, and so the man is never dead. The convention is an unofficial
# HTTP header carrying that name forever. It has no technical function and
# is meant not to.
#
# In its own snippet, and INCLUDED FROM EVERY server block on this domain,
# for the same anti-drift reason as status-cgi.conf and wkd.conf: a site
# that carried the header over HTTP but not HTTPS would rather miss the
# point.
#
# `always` so it is sent on error responses too — a 404 is still a message
# going up the line.
#
# NOTE ON add_header INHERITANCE: nginx's add_header is inherited into a
# nested block ONLY IF that block defines no add_header of its own. Any
# location that adds a header of its own therefore DROPS this one and must
# include this snippet again — see the WKD location in wkd.conf, which is
# currently the only such place.
add_header X-Clacks-Overhead "GNU Terry Pratchett" always;
