# /pgp.asc — the ASCII-armored public key linked from /professional.
#
# .asc has no entry in /etc/nginx/mime.types, so without this it inherits
# nginx.conf's `default_type application/octet-stream` and every browser
# treats a plainly readable text file as a download.
#
# text/plain, not the registered application/pgp-keys (RFC 3156), on purpose:
# this file exists so a human can click the link, read the block and copy it.
# application/pgp-keys is the technically correct label but browsers offer it
# as a download too, which is the exact behaviour being fixed here. Anything
# that actually consumes keys by content type fetches them from the WKD tree.
#
# THIS DOES NOT AFFECT WKD. The keys under /.well-known/openpgpkey/ are
# extensionless and binary, and must stay application/octet-stream per spec —
# they are matched by wkd.conf's regex location, not this exact-match one.
#
# No add_header here, so the server-level X-Clacks-Overhead is still inherited
# (see clacks.conf).
location = /pgp.asc {
    default_type text/plain;
    charset utf-8;
}
