# /professional/status — live service status, rendered per request by
# /srv/cgi/status.cgi via fcgiwrap.
#
# Included from BOTH the :80 and :443 server blocks for dreamstation.systems.
# It lives in a snippet rather than being pasted twice so the two cannot drift
# apart — a status page that works over HTTP but 404s over HTTPS would be a
# particularly silly bug.
#
# See ~/configNotes/status.txt for the design.

# Exact match: this is one page, not a tree. Anything under it is not ours.
location = /professional/status {
    fastcgi_pass  unix:/run/fcgiwrap.socket;
    include       fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/cgi/status.cgi;
    fastcgi_param SCRIPT_NAME     /professional/status;

    # Must exceed the CGI's own 8s sweep budget plus the timeout of whichever
    # probe is in flight when the budget expires. The script is designed never
    # to reach this; if it does, the error_page below catches it.
    fastcgi_read_timeout 15s;

    # If the script cannot run at all — fcgiwrap down, file missing, a syntax
    # error that somehow survived deploy-site.sh's gate — serve the static
    # backstop instead of nginx's bare error page.
    #
    # No "=" before the URI: the response keeps its 502/504 status. The body is
    # honest and human-readable, but the status code stays truthful for anything
    # machine-reading it.
    error_page 502 503 504 /professional/status-down.html;
}

# The canonical URL has no trailing slash. Redirect rather than 404 so a
# hand-typed or mis-copied link still lands.
location = /professional/status/ {
    return 301 /professional/status;
}

# --------------------------------------------------------------------------
# The compact vitals box in the corner of /professional/, injected server-side.

# `internal` means this URI is reachable ONLY from an nginx subrequest — the
# SSI include below — and never from the outside. A naked HTML fragment sitting
# on a public URL would be a loose end serving no one.
#
# STATUS_MODE=box makes status.cgi emit just the fragment: two small file
# reads, no probing, no cache. See render_box() for why it must stay that way.
location = /professional/status-box {
    internal;

    fastcgi_pass  unix:/run/fcgiwrap.socket;
    include       fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/cgi/status.cgi;
    fastcgi_param SCRIPT_NAME     /professional/status-box;
    fastcgi_param STATUS_MODE     box;

    # No sweep can occur in box mode, so the 15s the full page needs would only
    # serve to hang the resume page behind a wedged worker. Fail fast instead —
    # a missing box is a non-event, a slow front page is not.
    fastcgi_read_timeout 3s;
}

# SSI is enabled on exactly ONE page. Nothing else on this site is server-
# parsed, and index.html contains exactly one include directive.
#
# A request for /professional/ is internally redirected to
# /professional/index.html by the `index` directive; internal redirects re-run
# location matching, so it lands here and gets parsed.
#
# ssi_silent_errors: when fcgiwrap is down or the script fails, the include
# expands to NOTHING and the page renders exactly as it did before the box
# existed. The box is decoration and must never be able to damage the page
# carrying it — which is why the <aside> element comes from the CGI too,
# rather than being an empty shell left behind in the HTML.
location = /professional/index.html {
    ssi on;
    ssi_silent_errors on;
}
